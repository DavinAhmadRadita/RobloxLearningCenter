<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Roblox Learning Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/password-pages.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <main class="auth-page password-page">
    <section class="auth-shell password-shell">
      <div class="auth-topline">
        <div class="auth-brand">
          <div class="brand">
            <span class="roblox-mark"><span></span></span>
            <span>ROBLOX LEARNING<br />CENTER</span>
          </div>
        </div>
      </div>
      <div class="auth-hero password-hero">
        <h1>Forgot Password</h1>
        <p>Enter your registered email address and<br class="desktop-break" /> we'll send you a link to reset your password.</p>
        <div class="character" aria-hidden="true">
          <img src="assets/character-login.png" alt="" />
        </div>
      </div>
      <section class="auth-card password-card">
        <form id="forgot-password-form" novalidate>
          <label class="password-field-label" for="forgot-email">Email Address</label>
          <label class="input-wrap">
            <input id="forgot-email" type="email" placeholder="Email Address" autocomplete="email" autocapitalize="none" spellcheck="false" />
          </label>
          <p class="error-message" id="forgot-error" aria-live="polite"></p>
          <button class="primary-button" id="forgot-submit" type="submit" disabled>Send Reset Link</button>
          <p class="password-feedback" id="forgot-feedback" aria-live="polite"></p>
        </form>
      </section>
    </section>
  </main>
  <script src="js/password-pages.js"></script>
</body>
</html>
