  </defs>

  <!-- Daun Laurel Samping -->
  <g transform="translate(100, 100)" fill="url(#b3-frame)">
    <path d="M -68,32 C -86,10 -82,-30 -54,-56 C -64,-34 -60,-5 -48,20 Z" />
