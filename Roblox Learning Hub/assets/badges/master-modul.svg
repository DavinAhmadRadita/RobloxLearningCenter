    <polygon points="0,-68 58,-33 58,33 0,68 -58,33 -58,-33" fill="url(#b3-bg)" stroke="#ffe066" stroke-width="2" />
    
    <!-- Mahkota Atas -->
    <path d="M -18,-76 L -24,-88 L -10,-82 L 0,-92 L 10,-82 L 24,-88 L 18,-76 Z" fill="url(#b3-frame)" stroke="#ffffff" stroke-width="1.2" />
