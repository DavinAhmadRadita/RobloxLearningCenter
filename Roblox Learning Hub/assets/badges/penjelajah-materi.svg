<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="b4-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3a7bd5" />
    </linearGradient>
    <linearGradient id="b4-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071b36" />
      <stop offset="100%" stop-color="#010610" />
    </linearGradient>
    <filter id="glow-b4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(100, 100)" filter="url(#glow-b4)">
    <polygon points="0,-78 68,-39 68,39 0,78 -68,39 -68,-39" fill="url(#b4-frame)" />
    <polygon points="0,-68 58,-33 58,33 0,68 -58,33 -58,-33" fill="url(#b4-bg)" stroke="#00d2ff" stroke-width="2" />
    
    <!-- Permata Kristal -->
    <polygon points="0,-82 7,-72 -7,-72" fill="#ffffff" />
    <polygon points="72,-39 62,-47 62,-31" fill="#00d2ff" />
    <polygon points="-72,-39 -62,-47 -62,-31" fill="#00d2ff" />
    <polygon points="72,39 62,47 62,31" fill="#00d2ff" />
    <polygon points="-72,39 -62,47 -62,31" fill="#00d2ff" />
    <polygon points="0,82 7,72 -7,72" fill="#00d2ff" />

    <!-- Layar / Monitor Video -->
    <rect x="-36" y="-26" width="72" height="52" rx="10" fill="url(#b4-frame)" stroke="#ffffff" stroke-width="1.5" />
    <!-- Stand Layar -->
    <path d="M -12,26 L 12,26 L 16,33 L -16,33 Z" fill="url(#b4-frame)" />
    <!-- Tombol Play -->
    <polygon points="-10,-15 16,0 -10,15" fill="#ffffff" />
  </g>
</svg>