<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="b1-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#003399" />
    </linearGradient>
    <linearGradient id="b1-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a2540" />
      <stop offset="100%" stop-color="#05101e" />
    </linearGradient>
    <linearGradient id="b1-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60efff" />
      <stop offset="100%" stop-color="#0061ff" />
    </linearGradient>
    <filter id="glow-b1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(100, 100)" filter="url(#glow-b1)">
    <!-- Heksagon Utama -->
    <polygon points="0,-78 68,-39 68,39 0,78 -68,39 -68,-39" fill="url(#b1-frame)" />
    <polygon points="0,-68 58,-33 58,33 0,68 -58,33 -58,-33" fill="url(#b1-bg)" stroke="#00f2fe" stroke-width="2" />
    
    <!-- Permata Sudut -->
    <polygon points="0,-82 7,-72 -7,-72" fill="#ffffff" />
    <polygon points="72,-39 62,-47 62,-31" fill="#00f2fe" />
    <polygon points="-72,-39 -62,-47 -62,-31" fill="#00f2fe" />
    <polygon points="72,39 62,47 62,31" fill="#00f2fe" />
    <polygon points="-72,39 -62,47 -62,31" fill="#00f2fe" />
    <polygon points="0,82 7,72 -7,72" fill="#00f2fe" />

    <!-- Ikon Roblox -->
    <g transform="rotate(-15)">
      <rect x="-26" y="-26" width="52" height="52" rx="8" fill="url(#b1-icon)" stroke="#ffffff" stroke-width="1.5" />
      <rect x="-9" y="-9" width="18" height="18" rx="2" fill="#05101e" />
    </g>
  </g>
</svg>