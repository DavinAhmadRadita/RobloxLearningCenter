<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="b6-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#bdc3c7" />
      <stop offset="100%" stop-color="#2c3e50" />
    </linearGradient>
    <linearGradient id="b6-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow-b6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(100, 100)" filter="url(#glow-b6)">
    <polygon points="0,-78 68,-39 68,39 0,78 -68,39 -68,-39" fill="url(#b6-frame)" />
    <polygon points="0,-68 58,-33 58,33 0,68 -58,33 -58,-33" fill="url(#b6-bg)" stroke="#e2e8f0" stroke-width="2" />
    
    <!-- Permata Kristal -->
    <polygon points="0,-82 7,-72 -7,-72" fill="#ffffff" />
    <polygon points="72,-39 62,-47 62,-31" fill="#cbd5e1" />
    <polygon points="-72,-39 -62,-47 -62,-31" fill="#cbd5e1" />
    <polygon points="72,39 62,47 62,31" fill="#cbd5e1" />
    <polygon points="-72,39 -62,47 -62,31" fill="#cbd5e1" />
    <polygon points="0,82 7,72 -7,72" fill="#cbd5e1" />

    <!-- Jendela Kode -->
    <rect x="-36" y="-26" width="72" height="52" rx="9" fill="#0b132b" stroke="#e2e8f0" stroke-width="2" />
    <line x1="-36" y1="-13" x2="36" y2="-13" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="-27" cy="-19" r="2.5" fill="#ff5f56" />
    <circle cx="-20" cy="-19" r="2.5" fill="#ffbd2e" />
    <circle cx="-13" cy="-19" r="2.5" fill="#27c93f" />

    <!-- Simbol </> -->
    <text x="0" y="15" font-family="Consolas, monospace" font-weight="bold" font-size="24" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>