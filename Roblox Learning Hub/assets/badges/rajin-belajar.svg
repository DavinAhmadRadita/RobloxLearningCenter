<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="b7-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#38ef7d" />
    </linearGradient>
    <linearGradient id="b7-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#003319" />
      <stop offset="100%" stop-color="#001a0d" />
    </linearGradient>
    <filter id="glow-b7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Daun Laurel Samping Hijau -->
  <g transform="translate(100, 100)" fill="url(#b7-frame)">
    <path d="M -68,28 C -82,6 -76,-22 -54,-44 C -60,-27 -57,-5 -47,17 Z" />
    <path d="M 68,28 C 82,6 76,-22 54,-44 C 60,-27 57,-5 47,17 Z" />
  </g>

  <g transform="translate(100, 100)" filter="url(#glow-b7)">
    <polygon points="0,-78 68,-39 68,39 0,78 -68,39 -68,-39" fill="url(#b7-frame)" />
    <polygon points="0,-68 58,-33 58,33 0,68 -58,33 -58,-33" fill="url(#b7-bg)" stroke="#38ef7d" stroke-width="2" />
    
    <!-- Permata Kristal -->
    <polygon points="0,-82 7,-72 -7,-72" fill="#ffffff" />
    <polygon points="72,-39 62,-47 62,-31" fill="#38ef7d" />
    <polygon points="-72,-39 -62,-47 -62,-31" fill="#38ef7d" />
    <polygon points="72,39 62,47 62,31" fill="#38ef7d" />
    <polygon points="-72,39 -62,47 -62,31" fill="#38ef7d" />
    <polygon points="0,82 7,72 -7,72" fill="#38ef7d" />

    <!-- Kalender -->
    <rect x="-30" y="-24" width="60" height="52" rx="9" fill="#ffffff" />
    <path d="M -30,-14 L 30,-14 L 30,-24 C 30,-29 25,-33 20,-33 L -20,-33 C -25,-33 -30,-29 -30,-24 Z" fill="url(#b7-frame)" />
    <!-- Pengait Kalender -->
    <rect x="-19" y="-33" width="6" height="11" rx="2" fill="#ffffff" stroke="#11998e" stroke-width="1.2" />
    <rect x="13" y="-33" width="6" height="11" rx="2" fill="#ffffff" stroke="#11998e" stroke-width="1.2" />
    <!-- Angka 7 -->
    <text x="0" y="18" font-family="Arial, sans-serif" font-weight="900" font-size="38" fill="#003319" text-anchor="middle">7</text>
