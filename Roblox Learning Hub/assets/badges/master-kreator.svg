<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="b10-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="50%" stop-color="#f5a623" />
      <stop offset="100%" stop-color="#8b4513" />
    </linearGradient>
    <linearGradient id="b10-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2200" />
      <stop offset="100%" stop-color="#120a00" />
    </linearGradient>
    <filter id="glow-b10" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Daun Laurel Samping Emas -->
  <g transform="translate(100, 100)" fill="url(#b10-frame)">
    <path d="M -68,32 C -86,10 -82,-30 -54,-56 C -64,-34 -60,-5 -48,20 Z" />
    <path d="M 68,32 C 86,10 82,-30 54,-56 C 64,-34 60,-5 48,20 Z" />
  </g>

  <g transform="translate(100, 100)" filter="url(#glow-b10)">
    <polygon points="0,-78 68,-39 68,39 0,78 -68,39 -68,-39" fill="url(#b10-frame)" />
    <polygon points="0,-68 58,-33 58,33 0,68 -58,33 -58,-33" fill="url(#b10-bg)" stroke="#ffe066" stroke-width="2" />
    
    <!-- Mahkota Atas -->
    <path d="M -18,-76 L -24,-88 L -10,-82 L 0,-92 L 10,-82 L 24,-88 L 18,-76 Z" fill="url(#b10-frame)" stroke="#ffffff" stroke-width="1.2" />
    <polygon points="0,82 7,72 -7,72" fill="#ffe066" />

    <!-- Topi Toga -->
    <polygon points="0,-24 38,-10 0,4 -38,-10" fill="url(#b10-frame)" stroke="#ffffff" stroke-width="1.5" />
    <path d="M -22,-2 L -22,16 C -22,25 22,25 22,16 L 22,-2" fill="#3a2200" stroke="#ffe066" stroke-width="1.5" />
    <!-- Tali Toga -->
    <path d="M 0,-10 L 26,4 L 26,22" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="26" cy="24" r="3.5" fill="#ffffff" />
  </g>
