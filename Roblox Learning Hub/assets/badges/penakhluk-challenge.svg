<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="b5-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b1f" />
      <stop offset="100%" stop-color="#ff9068" />
    </linearGradient>
    <linearGradient id="b5-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a0000" />
      <stop offset="100%" stop-color="#1a0000" />
    </linearGradient>
    <linearGradient id="b5-trophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <filter id="glow-b5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(100, 100)" filter="url(#glow-b5)">
    <polygon points="0,-78 68,-39 68,39 0,78 -68,39 -68,-39" fill="url(#b5-frame)" />
    <polygon points="0,-68 58,-33 58,33 0,68 -58,33 -58,-33" fill="url(#b5-bg)" stroke="#ff758c" stroke-width="2" />
    
    <!-- Permata Kristal -->
    <polygon points="0,-82 7,-72 -7,-72" fill="#ffffff" />
    <polygon points="72,-39 62,-47 62,-31" fill="#ff758c" />
    <polygon points="-72,-39 -62,-47 -62,-31" fill="#ff758c" />
    <polygon points="72,39 62,47 62,31" fill="#ff758c" />
    <polygon points="-72,39 -62,47 -62,31" fill="#ff758c" />
    <polygon points="0,82 7,72 -7,72" fill="#ff758c" />

    <!-- Piala Emas -->
    <path d="M -24,-26 L 24,-26 L 20,2 C 16,18 0,22 0,22 C 0,22 -16,18 -20,2 Z" fill="url(#b5-trophy)" stroke="#ffffff" stroke-width="1.2" />
    <!-- Pegangan Kiri & Kanan -->
    <path d="M -24,-20 C -35,-20 -33,-2 -22,-2" fill="none" stroke="#ffe066" stroke-width="4" stroke-linecap="round" />
    <path d="M 24,-20 C 35,-20 33,-2 22,-2" fill="none" stroke="#ffe066" stroke-width="4" stroke-linecap="round" />
    <!-- Batang & Kaki -->
    <rect x="-7" y="22" width="14" height="9" fill="#d4af37" />
    <rect x="-18" y="31" width="36" height="8" rx="2" fill="url(#b5-trophy)" />
    <!-- Bintang Merah -->
    <polygon points="0,-12 3,-3 12,-3 5,3 7,11 0,6 -7,11 -5,3 -12,-3 -3,-3" fill="#ff4b1f" />
  </g>
</svg>