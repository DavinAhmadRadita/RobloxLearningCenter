<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="b8-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b92b27" />
      <stop offset="50%" stop-color="#1565c0" />
      <stop offset="100%" stop-color="#8e2de2" />
    </linearGradient>
    <linearGradient id="b8-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a0845" />
      <stop offset="100%" stop-color="#0d021a" />
    </linearGradient>
    <linearGradient id="b8-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0c3fc" />
      <stop offset="100%" stop-color="#8e2de2" />
    </linearGradient>
    <filter id="glow-b8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(100, 100)" filter="url(#glow-b8)">
    <polygon points="0,-78 68,-39 68,39 0,78 -68,39 -68,-39" fill="url(#b8-frame)" />
    <polygon points="0,-68 58,-33 58,33 0,68 -58,33 -58,-33" fill="url(#b8-bg)" stroke="#e0c3fc" stroke-width="2" />
    
    <!-- Permata Kristal -->
    <polygon points="0,-82 7,-72 -7,-72" fill="#ffffff" />
    <polygon points="72,-39 62,-47 62,-31" fill="#e0c3fc" />
    <polygon points="-72,-39 -62,-47 -62,-31" fill="#e0c3fc" />
    <polygon points="72,39 62,47 62,31" fill="#e0c3fc" />
    <polygon points="-72,39 -62,47 -62,31" fill="#e0c3fc" />
    <polygon points="0,82 7,72 -7,72" fill="#e0c3fc" />

    <!-- 3 Anggota -->
    <!-- Samping Kiri -->
    <circle cx="-20" cy="-6" r="10" fill="url(#b8-icon)" opacity="0.85" />
    <path d="M -35,24 C -35,11 -20,11 -20,24 Z" fill="url(#b8-icon)" opacity="0.85" />
    <!-- Samping Kanan -->
    <circle cx="20" cy="-6" r="10" fill="url(#b8-icon)" opacity="0.85" />
    <path d="M 5,24 C 5,11 35,11 35,24 Z" fill="url(#b8-icon)" opacity="0.85" />
    <!-- Tengah Utama -->
    <circle cx="0" cy="-12" r="12" fill="#ffffff" />
    <path d="M -18,24 C -18,8 18,8 18,24 Z" fill="#ffffff" />
  </g>
</svg>