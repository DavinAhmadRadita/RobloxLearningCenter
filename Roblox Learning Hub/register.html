<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Roblox Learning Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@800;900&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/register.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>

<body>
  <main id="register-view" class="auth-page">
    <section class="auth-shell register-shell">
      <div class="auth-topline">
        <div class="auth-brand">
          <div class="brand" id="auth-home-register">
            <span class="roblox-mark"><span></span></span>
            <span>ROBLOX LEARNING<br />CENTER</span>
          </div>
        </div>
      </div>
      <div class="auth-hero register-hero">
        <h1>Create Your Account <span>🚀</span></h1>
        <p>Start learning Roblox development<br />step by step</p>
        <div class="character" aria-hidden="true">
          <img src="assets/character-register.png" alt="" />
        </div>
      </div>
      <section class="auth-card register-card">
        <h2>Create Account</h2>
        <form id="register-form" novalidate>
          <label class="input-wrap">
            <span class="field-icon"><i data-lucide="user-round" aria-hidden="true"></i></span>
            <input id="register-username" type="text" placeholder="Username" autocomplete="username" />
            <small id="username-feedback" class="username-feedback" aria-live="polite"></small>
          </label>
          <label class="input-wrap">
            <span class="field-icon"><i data-lucide="mail" aria-hidden="true"></i></span>
            <input id="register-email" type="email" placeholder="Email" autocomplete="email" />
          </label>
          <label class="input-wrap">
            <span class="field-icon"><i data-lucide="lock-keyhole" aria-hidden="true"></i></span>
            <input id="register-password" type="password" placeholder="Password" autocomplete="new-password" />
            <button class="toggle-password" type="button" data-target="register-password" aria-label="Show password"
              aria-pressed="false">
              <i data-lucide="eye" aria-hidden="true"></i>
            </button>
          </label>
          <label class="input-wrap">
            <span class="field-icon"><i data-lucide="lock-keyhole" aria-hidden="true"></i></span>
            <input id="register-confirm" type="password" placeholder="Confirm Password" autocomplete="new-password" />
            <button class="toggle-password" type="button" data-target="register-confirm"
              aria-label="Show confirm password" aria-pressed="false">
              <i data-lucide="eye" aria-hidden="true"></i>
            </button>
          </label>
          <label class="terms-row"><input id="terms-check" type="checkbox" /><span>I agree to the
              <a href="#" id="terms-link">Term &amp; Privacy</a></span></label>
          <p class="error-message" id="register-error" aria-live="polite"></p>
          <button class="primary-button" id="register-submit" type="submit" disabled>
            Register
          </button>
        </form>
        <p class="switch-text">
          Already have an account ?
          <button class="text-button" id="go-login" type="button">
            Login
          </button>
        </p>
      </section>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/auth.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
</body>

</html>
