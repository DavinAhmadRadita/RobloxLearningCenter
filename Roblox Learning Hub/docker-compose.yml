services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: roblox-learning-center-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8000
      DB_HOST: host.docker.internal
      DB_PORT: 3307
    ports:
      - "${APP_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
