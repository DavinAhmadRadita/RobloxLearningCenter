<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | Roblox Learning Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@800;900&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/theme.css">
</head>

<body>
  <main id="login-view" class="auth-page">
    <section class="auth-shell">
      <div class="auth-topline">
        <div class="auth-brand">
          <div class="brand" id="auth-home-login">
            <span class="roblox-mark"><span></span></span>
            <span>ROBLOX LEARNING<br />CENTER</span>
          </div>
        </div>
      </div>
      <div class="auth-hero">
        <h1>Welcome Back <span>👋🏻</span></h1>
        <p>Login to continue your learning journey</p>
        <div class="character" aria-hidden="true">
          <img src="assets/character-login.png" alt="" />
        </div>
      </div>
      <section class="auth-card login-card">
        <h2>Sign In</h2>
        <form id="login-form" novalidate>
          <label class="input-wrap">
            <span class="field-icon"><i data-lucide="user-round" aria-hidden="true"></i></span>
            <input id="login-identity" type="text" placeholder="Username" autocomplete="username" />
          </label>
          <label class="input-wrap">
            <span class="field-icon"><i data-lucide="lock-keyhole" aria-hidden="true"></i></span>
            <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" />
            <button class="toggle-password" type="button" data-target="login-password" aria-label="Show password"
              aria-pressed="false">
              <i data-lucide="eye" aria-hidden="true"></i>
            </button>
          </label>
          <p class="error-message" id="login-error" aria-live="polite"></p>
          <label class="remember-row" for="remember-me">
            <input id="remember-me" type="checkbox" />
            <span class="remember-check" aria-hidden="true"></span>
            <span>Remember me</span>
          </label>
          <button class="primary-button" id="login-submit" type="submit" disabled>
            Sign In
          </button>
        </form>
        <p class="switch-text">
          Don’t have account ?
          <button class="text-button" id="go-register" type="button">
            Register
          </button>
        </p>
      </section>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/auth.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
</body>

</html>
