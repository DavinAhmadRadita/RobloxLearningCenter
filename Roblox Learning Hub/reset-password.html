<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Roblox Learning Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/password-pages.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <main class="auth-page password-page">
    <section class="auth-shell password-shell reset-shell">
      <div class="auth-topline">
        <div class="auth-brand">
          <div class="brand">
            <span class="roblox-mark"><span></span></span>
            <span>ROBLOX LEARNING<br />CENTER</span>
          </div>
        </div>
      </div>
      <div class="auth-hero password-hero">
        <h1>Reset Password</h1>
        <p>Create a new password for your account.</p>
        <div class="character" aria-hidden="true">
          <img src="assets/character-login.png" alt="" />
        </div>
      </div>
      <section class="auth-card password-card">
        <form id="reset-password-form" novalidate>
          <label class="input-wrap">
            <input id="new-password" type="password" placeholder="New Password" autocomplete="new-password" />
            <button class="toggle-password" type="button" data-target="new-password" aria-label="Show password" aria-pressed="false">
              <i data-lucide="eye" aria-hidden="true"></i>
            </button>
          </label>
          <label class="input-wrap">
            <input id="confirm-new-password" type="password" placeholder="Confirm New Password" autocomplete="new-password" />
            <button class="toggle-password" type="button" data-target="confirm-new-password" aria-label="Show confirm password" aria-pressed="false">
              <i data-lucide="eye" aria-hidden="true"></i>
            </button>
          </label>
          <p class="password-hint">Password must be 8–32 characters.</p>
          <p class="error-message" id="reset-error" aria-live="polite"></p>
          <button class="primary-button" id="reset-submit" type="submit" disabled>Reset Password</button>
          <p class="password-feedback" id="reset-feedback" aria-live="polite"></p>
        </form>
      </section>
    </section>
  </main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
  <script src="js/password-pages.js"></script>
</body>
</html>
